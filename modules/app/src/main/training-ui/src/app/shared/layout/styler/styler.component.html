<div id="styleSelector" class="menu-styler">
    <div class="style-toggler">
        <a style="cursor: pointer;" (click)="openMenuStyler()"></a>
    </div>
    <div class="style-block">
        <!-- <h4 class="mb-2">Able-pro <small class="font-weight-normal">v8.0 Customizer</small></h4> -->
        <hr class="">
        <ng-scrollbar class="m-style-scroller" style="height: calc(100vh - 130px); position: relative;">
            <div style="padding: 15px 20px;">
                <h6 class="mt-2">Layouts</h6>
                <div class="theme-color layout-type">
                    <a href="javascript:" [class.active]="layoutType === 'menu-dark'" (click)="setLayout('menu-dark')"
                        data-value="menu-dark">
                        <span></span><span></span>
                    </a>
                    <a href="javascript:" [class.active]="layoutType === 'menu-light'" (click)="setLayout('menu-light')"
                        data-value="menu-light">
                        <span></span><span></span>
                    </a>
                    <a href="javascript:" [class.active]="layoutType === 'dark'" (click)="setLayout('dark')"
                        data-value="dark">
                        <span></span><span></span>
                    </a>
                    <a href="javascript:" [class.active]="layoutType === 'reset'" (click)="setLayout('reset')"
                        data-value="reset">Reset to Default
                    </a>
                </div>
                <h6>background color</h6>
                <div class="theme-color background-color flat">
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-blue'"
                        (click)="setHeaderBackground('background-blue')"
                        data-value="background-blue"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-red'"
                        (click)="setHeaderBackground('background-red')"
                        data-value="background-red"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-purple'"
                        (click)="setHeaderBackground('background-purple')"
                        data-value="background-purple"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-info'"
                        (click)="setHeaderBackground('background-info')"
                        data-value="background-info"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-green'"
                        (click)="setHeaderBackground('background-green')"
                        data-value="background-green"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-dark'"
                        (click)="setHeaderBackground('background-dark')"
                        data-value="background-dark"><span></span><span></span></a>
                </div>
                <h6>background Gradient</h6>
                <div class="theme-color background-color gradient">
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-blue'"
                        (click)="setHeaderBackground('background-grd-blue')"
                        data-value="background-grd-blue"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-red'"
                        (click)="setHeaderBackground('background-grd-red')"
                        data-value="background-grd-red"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-purple'"
                        (click)="setHeaderBackground('background-grd-purple')"
                        data-value="background-grd-purple"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-info'"
                        (click)="setHeaderBackground('background-grd-info')"
                        data-value="background-grd-info"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-green'"
                        (click)="setHeaderBackground('background-grd-green')"
                        data-value="background-grd-green"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-grd-dark'"
                        (click)="setHeaderBackground('background-grd-dark')"
                        data-value="background-grd-dark"><span></span><span></span></a>
                </div>
                <h6>background Image</h6>
                <div class="theme-color background-color image">
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-1'"
                        (click)="setHeaderBackground('background-img-1')"
                        data-value="background-img-1"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-2'"
                        (click)="setHeaderBackground('background-img-2')"
                        data-value="background-img-2"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-3'"
                        (click)="setHeaderBackground('background-img-3')"
                        data-value="background-img-3"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-4'"
                        (click)="setHeaderBackground('background-img-4')"
                        data-value="background-img-4"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-5'"
                        (click)="setHeaderBackground('background-img-5')"
                        data-value="background-img-5"><span></span><span></span></a>
                    <a href="javascript:" [class.active]="headerBackgroundColor === 'background-img-6'"
                        (click)="setHeaderBackground('background-img-6')"
                        data-value="background-img-6"><span></span><span></span></a>
                </div>
                @if(nextConfig['layout'] !== 'horizontal') {
                    <div class="form-group mb-2">
                        <div class="switch switch-primary d-inline m-r-10">
                            <input type="checkbox" id="theme-rtl" [(ngModel)]="rtlLayout" (change)="setRtlLayout($event)" />
                            <label for="theme-rtl" class="cr"></label>
                        </div>
                        <label>RTL</label>
                    </div>

                    @if (!nextConfig['boxLayout']) {
                        <div class="form-group mb-2">
                            <div class="switch switch-primary d-inline m-r-10">
                                <input type="checkbox" id="menu-fixed" [(ngModel)]="menuFixedLayout" (change)="setMenuFixedLayout($event)" />
                                <label for="menu-fixed" class="cr"></label>
                            </div>
                            <label>Menu Fixed</label>
                        </div>
                        <div class="form-group mb-2" >
                            <div class="switch switch-primary d-inline m-r-10">
                                <input type="checkbox" id="header-fixed" [(ngModel)]="headerFixedLayout" (change)="setHeaderFixedLayout($event)" />
                                <label for="header-fixed" class="cr"></label>
                            </div>
                            <label>Header Fixed</label>
                        </div>
                    }

                    <div class="form-group mb-2">
                        <div class="switch switch-primary d-inline m-r-10">
                            <input type="checkbox" id="box-layouts" [(ngModel)]="boxLayout" (change)="setBoxLayout($event)" />
                            <label for="box-layouts" class="cr"></label>
                        </div>
                        <label>Box Layouts</label>
                    </div>
                }
            </div>
        </ng-scrollbar>

    </div>
</div>
