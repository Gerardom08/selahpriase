<div class="login">
  <div class="login-container">
    <div class="login-body">
      <div class="login-content">
        <h5 class="text-center">
          <!-- <img src="/assets/img/logo.svg" alt="logo" class="img-responsive" style="height: 2rem;"> -->
        </h5>
        <h1 class="card-title text-center">Bienvenidos</h1>
        <button type="button" class="btn btn-primary d-block w-100 rounded font-weight-bold" (click)="login()">
          @if (spinner) {
          <div class="spinner-border spinner-border-sm text-light" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          } @else {
            <i class="fa fa-check-circle-o" aria-hidden="true"></i>
          }
          Iniciar
        </button>
      </div>
    </div>
  </div>
</div>
